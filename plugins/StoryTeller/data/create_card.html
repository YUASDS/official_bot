<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:440px; background:#0e0c08; padding:14px; }
  .card {
    background: linear-gradient(165deg,#1c1610 0%,#241a12 45%,#150d06 100%);
    border:1px solid #6b4a2a; border-radius:14px; padding:24px 20px;
    color:#e8d9b8; font-family:'Noto Serif SC','Microsoft YaHei',serif;
    box-shadow:0 0 24px rgba(107,74,42,.25) inset; text-align:center;
  }
  .seal {
    font-size:26px; color:#c9a86a; letter-spacing:5px; font-weight:900;
    text-shadow:0 0 18px rgba(201,168,106,.35);
  }
  .meta { color:#a88f6a; font-size:14px; margin-top:6px; letter-spacing:2px; }
  .bar { height:1px; background:linear-gradient(90deg,transparent,#c9a86a,transparent); margin:14px 0; }
  .panels { text-align:left; }
  .panel {
    background:rgba(201,168,106,.05); border:1px solid rgba(201,168,106,.16);
    border-radius:10px; padding:12px 12px 10px; margin-top:10px;
  }
  .p-title { color:#c9a86a; font-size:14px; font-weight:900; letter-spacing:2px; margin-bottom:8px; }
  .p-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .p-item {
    flex:1 1 80px; max-width:100px; display:flex; justify-content:space-between;
    background:rgba(201,168,106,.06); border-radius:6px; padding:4px 8px; font-size:13px;
  }
  .p-item i { color:#a88f6a; font-style:normal; }
  .p-item b { color:#f3e3c0; }
  .hint {
    color:#d9b87c; font-size:13px; line-height:1.9; margin-top:14px; text-align:left;
    background:rgba(201,168,106,.04); border-left:3px solid #6b4a2a; padding:8px 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="seal">__ICON__ __TITLE__</div>
  <div class="meta">__META__</div>
  <div class="bar"></div>
  <div class="panels">__PANELS__</div>
  <div class="hint">__HINT__</div>
</div>
</body>
</html>
